<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · PX Outreach Engine</title>
  <style>
    :root {
      --blue:#0F52BA; --ink:#172033; --muted:#667085; --line:#D9E2F2; --panel:#FFFFFF;
      --color-primary:#2563EB; --color-primary-dark:#1D4ED8; --color-sidebar-bg:#1A1A2E;
      --color-text-primary:#111827; --color-success:#10B981; --color-danger:#DC2626;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; font-family:Arial, Helvetica, sans-serif; color:var(--ink);
      background:var(--color-sidebar-bg); display:flex; align-items:center; justify-content:center;
    }
    .card {
      background:var(--panel); border-radius:10px; padding:44px 48px; box-shadow:0 8px 30px rgba(0,0,0,0.25);
      max-width:460px; width:calc(100% - 40px);
    }
    h1 { margin:0 0 6px; font-size:1.5rem; font-weight:800; color:var(--color-text-primary); }
    .subtitle { margin:0 0 28px; color:var(--muted); font-size:14px; line-height:1.5; }
    label { display:block; font-size:13px; font-weight:700; margin-bottom:6px; color:var(--color-text-primary); }
    input[type=email] {
      width:100%; padding:12px 14px; font-size:15px; font-family:inherit;
      border:1px solid var(--line); border-radius:6px; margin-bottom:18px;
    }
    input[type=email]:focus { outline:2px solid var(--color-primary); outline-offset:0; border-color:transparent; }
    button {
      width:100%; font-family:inherit; font-size:1rem; font-weight:700; color:#FFFFFF; cursor:pointer;
      border:none; border-radius:6px; padding:13px 12px; background:var(--color-primary);
      transition:background 0.15s ease;
    }
    button:hover:not(:disabled) { background:var(--color-primary-dark); }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    .msg { margin-top:18px; padding:12px 14px; border-radius:6px; font-size:14px; line-height:1.5; display:none; }
    .msg.ok { display:block; background:#ECFDF5; color:#065F46; border:1px solid #A7F3D0; }
    .msg.err { display:block; background:#FEF2F2; color:#991B1B; border:1px solid #FECACA; }
    .hint { margin-top:22px; font-size:12px; color:var(--muted); line-height:1.5; }
    .dev-link { margin-top:12px; font-size:12px; word-break:break-all; }
  </style>
</head>
<body>
  <main class="card">
    <h1>PX Outreach Engine</h1>
    <p class="subtitle">
      Informe seu e-mail corporativo. Enviamos um link de acesso &mdash; sem senha.
    </p>

    <form id="form">
      <label for="email">E-mail corporativo</label>
      <input type="email" id="email" name="email" required autocomplete="email"
             placeholder="nome.sobrenome@px.center" autofocus>
      <button type="submit" id="submit">Receber link de acesso</button>
    </form>

    <div id="msg" class="msg"></div>

    <p class="hint">
      O link vale por 15 minutos e s&oacute; funciona uma vez. Depois de entrar, voc&ecirc;
      permanece conectado por 30 dias neste navegador.<br>
      Sem acesso ainda? Fale com o Marketing para ser liberado.
    </p>
  </main>

  <script>
    var ERROS = {
      "token-ausente":  "Link incompleto. Peça um novo link de acesso abaixo.",
      "token-invalido": "Link inválido. Peça um novo link de acesso abaixo.",
      "token-expirado": "Este link expirou. Peça um novo abaixo.",
      "token-usado":    "Este link já foi usado. Peça um novo abaixo.",
      "acesso-inativo": "Seu acesso está desativado. Fale com o Marketing.",
      "sessao-encerrada": "Sessão encerrada."
    };

    var params = new URLSearchParams(window.location.search);
    var msg = document.getElementById("msg");
    var form = document.getElementById("form");
    var submit = document.getElementById("submit");

    var erro = params.get("erro");
    if (erro && ERROS[erro]) {
      msg.className = "msg err";
      msg.textContent = ERROS[erro];
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      submit.disabled = true;
      submit.textContent = "Enviando...";

      fetch("/api/auth/magic-link", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("email").value })
      })
        .then(function (response) { return response.json().catch(function () { return {}; }); })
        .then(function (payload) {
          msg.className = "msg ok";
          msg.innerHTML =
            "Se este e-mail tiver acesso liberado, o link já está a caminho. " +
            "Confira sua caixa de entrada.";

          // Em desenvolvimento (MAIL_DRIVER=console) nada é enviado de verdade;
          // o link aparece no terminal do servidor.
          if (payload && payload.data && payload.data.link) {
            var a = document.createElement("div");
            a.className = "dev-link";
            a.innerHTML = '<strong>Modo dev:</strong> <a href="' + payload.data.link + '">' + payload.data.link + "</a>";
            msg.appendChild(a);
          }
        })
        .catch(function () {
          msg.className = "msg err";
          msg.textContent = "Não foi possível enviar agora. Tente novamente em instantes.";
        })
        .finally(function () {
          submit.disabled = false;
          submit.textContent = "Receber link de acesso";
        });
    });
  </script>
</body>
</html>
